<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pulse-energy {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .chain-link {
        stroke-dasharray: 8, 6;
        animation: dashMove 12s linear infinite;
      }
      .chain-link-rev {
        stroke-dasharray: 8, 6;
        animation: dashMove 8s linear infinite reverse;
      }
      .node-dot {
        transform-origin: center;
        animation: nodePulse 3s ease-in-out infinite;
      }
      .rotating-elem {
        transform-origin: 980px 180px;
        animation: rotateRing 20s linear infinite;
      }
      .text-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .text-desc {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      .text-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="980" cy="180" r="160" fill="#7000ff" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="600" cy="280" r="130" fill="#00f2fe" opacity="0.06" filter="url(#softGlow)" />

  <!-- Cybernetic Grid / Constellation in Background -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="50" x2="220" y2="120" />
    <line x1="220" y1="120" x2="160" y2="240" />
    <line x1="160" y1="240" x2="340" y2="300" />
    <line x1="850" y1="60" x2="980" y2="110" />
    <line x1="980" y1="110" x2="1120" y2="70" />
    <line x1="1120" y1="70" x2="1060" y2="220" />
    <line x1="1060" y1="220" x2="1140" y2="310" />
    <line x1="920" y1="280" x2="1060" y2="220" />
  </g>

  <!-- Constellation Nodes -->
  <circle cx="80" cy="50" r="2.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="220" cy="120" r="3" fill="#818cf8" opacity="0.5" />
  <circle cx="160" cy="240" r="2.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="340" cy="300" r="2" fill="#c084fc" opacity="0.3" />
  <circle cx="850" cy="60" r="2.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="1120" cy="70" r="3" fill="#c084fc" opacity="0.5" />
  <circle cx="1140" cy="310" r="2.5" fill="#818cf8" opacity="0.4" />

  <!-- Animated Connection Stream / Blockchain Network Beam -->
  <path d="M 100 320 Q 300 290, 500 330 T 900 270 T 1150 290" 
        fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.35" class="chain-link" />
  <path d="M 50 200 C 300 130, 700 380, 1150 140" 
        fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.25" class="chain-link-rev" />

  <!-- LEFT / CENTER: Typography & Badges -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 56)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" class="node-dot" />
      <text x="28" y="18" fill="#94a3b8" font-size="11" class="text-tag">CURATED WEB3 ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" font-size="44" fill="url(#titleGrad)" class="text-title" filter="url(#glow)">Top Open Source</text>
      <text x="0" y="52" font-size="44" fill="#ffffff" class="text-title">Blockchain Projects</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="222" font-size="16" fill="#94a3b8" class="text-desc">
      A stargazers-ranked index of layer-1s, smart contract runtimes,
    </text>
    <text x="0" y="246" font-size="16" fill="#94a3b8" class="text-desc">
      protocols, developer toolkits, and decentralized infrastructure.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 278)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="92" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
        <text x="46" y="17" fill="#38bdf8" font-size="11" class="text-tag" text-anchor="middle">★ RANKED</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(104, 0)">
        <rect width="136" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
        <text x="68" y="17" fill="#a5b4fc" font-size="11" class="text-tag" text-anchor="middle">⚡ WEB3 INFRA</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(252, 0)">
        <rect width="124" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
        <text x="62" y="17" fill="#e879f9" font-size="11" class="text-tag" text-anchor="middle">🔗 OPEN SOURCE</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Dynamic 3D Isometric Blockchain Nodes Illustration -->
  <g class="floating-group">
    <!-- Center of illustration: x = 980, y = 180 -->
    
    <!-- Outer Orbit Ring -->
    <circle cx="980" cy="180" r="115" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="10, 12" opacity="0.3" class="rotating-elem" />
    <circle cx="980" cy="180" r="135" fill="none" stroke="url(#neonPurple)" stroke-width="1" stroke-dasharray="4, 10" opacity="0.25" class="rotating-elem" style="animation-direction: reverse; animation-duration: 28s;" />

    <!-- Connecting Link Bars between Blocks -->
    <g stroke="url(#titleGrad)" stroke-width="2.5" opacity="0.75">
      <!-- Link 1 to Center -->
      <line x1="880" y1="130" x2="980" y2="180" stroke-dasharray="4, 4" class="chain-link" />
      <!-- Link Center to 2 -->
      <line x1="980" y1="180" x2="1080" y2="135" stroke-dasharray="4, 4" class="chain-link" />
      <!-- Link Center to Bottom -->
      <line x1="980" y1="180" x2="980" y2="280" stroke-dasharray="4, 4" class="chain-link" />
    </g>

    <!-- BLOCK 1 (Top Left Isometric Cube) -->
    <g transform="translate(880, 130)">
      <!-- Top face -->
      <polygon points="0,-24 24,-10 0,4 -24,-10" fill="url(#cubeGrad1)" stroke="#38bdf8" stroke-width="1" />
      <!-- Left face -->
      <polygon points="-24,-10 0,4 0,32 -24,18" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
      <!-- Right face -->
      <polygon points="0,4 24,-10 24,18 0,32" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="-3" r="3" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- BLOCK 2 (Top Right Isometric Cube) -->
    <g transform="translate(1080, 135)">
      <!-- Top face -->
      <polygon points="0,-22 22,-9 0,4 -22,-9" fill="url(#cubeGrad3)" stroke="#c084fc" stroke-width="1" />
      <!-- Left face -->
      <polygon points="-22,-9 0,4 0,30 -22,17" fill="#1e1b4b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
      <!-- Right face -->
      <polygon points="0,4 22,-9 22,17 0,30" fill="#2e1065" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" />
      <circle cx="0" cy="-2" r="3" fill="#c084fc" filter="url(#glow)" />
    </g>

    <!-- BLOCK 3 (Bottom Isometric Cube) -->
    <g transform="translate(980, 275)">
      <!-- Top face -->
      <polygon points="0,-20 20,-8 0,4 -20,-8" fill="url(#cubeGrad2)" stroke="#818cf8" stroke-width="1" />
      <!-- Left face -->
      <polygon points="-20,-8 0,4 0,26 -20,14" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" />
      <!-- Right face -->
      <polygon points="0,4 20,-8 20,14 0,26" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" />
      <circle cx="0" cy="-2" r="2.5" fill="#818cf8" filter="url(#glow)" />
    </g>

    <!-- MAIN CENTER BLOCK (Genesis Block - Highlighted) -->
    <g transform="translate(980, 180)">
      <!-- Glowing base aura -->
      <circle cx="0" cy="6" r="38" fill="#38bdf8" opacity="0.25" filter="url(#softGlow)" class="pulse-energy" />
      <!-- Top face -->
      <polygon points="0,-36 36,-15 0,6 -36,-15" fill="#38bdf8" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="1.5" />
      <!-- Left face -->
      <polygon points="-36,-15 0,6 0,46 -36,25" fill="#0369a1" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Right face -->
      <polygon points="0,6 36,-15 36,25 0,46" fill="#0284c7" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />

      <!-- Cryptographic Core Icon in the Genesis block -->
      <circle cx="0" cy="-4" r="7" fill="#ffffff" filter="url(#glow)" class="node-dot" />
      <path d="M -12 -10 L 0 -16 L 12 -10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Glowing Orbiting Data Particles -->
    <circle cx="890" cy="220" r="3.5" fill="#00f2fe" filter="url(#glow)" class="node-dot" style="animation-delay: 1s;" />
    <circle cx="1060" cy="235" r="3" fill="#f355da" filter="url(#glow)" class="node-dot" style="animation-delay: 1.8s;" />
    <circle cx="940" cy="110" r="2.5" fill="#a78bfa" filter="url(#glow)" style="animation-delay: 0.5s;" />
  </g>

  <!-- Border Highlight / Card Outline -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
