/pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}@keyframes pulseGlow{0%{opacity:.45}50%{opacity:.9}}@keyframes dashMove{0%{stroke-dashoffset:200}}@keyframes nodePulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.25);opacity:1}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.floating-group{animation:floatSlow 6s ease-in-out infinite}.pulse-energy{animation:pulseGlow 4s ease-in-out infinite}.chain-link,.chain-link-rev{stroke-dasharray:8,6;animation:dashMove 12s linear infinite}.chain-link-rev{animation:dashMove 8s linear infinite reverse}.node-dot{transform-origin:center;animation:nodePulse 3s ease-in-out infinite}.rotating-elem{transform-origin:980px 180px;animation:rotateRing 20s linear infinite}.text-desc,.text-title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Oxygen,Ubuntu,Cantarell,sans-serif}.text-title{font-weight:800;letter-spacing:-.03em}.text-desc{font-weight:400;letter-spacing:.02em}.text-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;letter-spacing:.05em}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#softGlow)" opacity=".08"/><circle cx="980" cy="180" r="160" fill="#7000ff" filter="url(#softGlow)" opacity=".12"/><circle cx="600" cy="280" r="130" fill="#00f2fe" filter="url(#softGlow)" opacity=".06"/><g stroke="#38bdf8" stroke-opacity=".15" stroke-width="1"><line x1="80" x2="220" y1="50" y2="120"/><line x1="220" x2="160" y1="120" y2="240"/><line x1="160" x2="340" y1="240" y2="300"/><line x1="850" x2="980" y1="60" y2="110"/><line x1="980" x2="1120" y1="110" y2="70"/><line x1="1120" x2="1060" y1="70" y2="220"/><line x1="1060" x2="1140" y1="220" y2="310"/><line x1="920" x2="1060" y1="280" y2="220"/></g><circle cx="80" cy="50" r="2.5" fill="#38bd